<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="testTelegramExport.js"></script>
    <style>body { margin: 0; padding: 0; overflow: hidden; }</style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // Конфигурация Godot Engine
        const engine = new Engine();
        
        engine.startGame({
            canvas: document.getElementById('canvas'),
            executable: 'testTelegramExport',
            mainPack: 'testTelegramExport.pck',
            // Критически важные параметры:
            locateFile: (path, prefix) => {
                // Правильно разрешаем пути к WASM и PCK файлам
                if (path.endsWith('.wasm')) return 'testTelegramExport.wasm';
                if (path.endsWith('.pck')) return 'testTelegramExport.pck';
                return prefix + path;
            },
            onProgress: (current, total) => {
                console.log(`Загрузка: ${current}/${total}`);
            }
        }).then(() => {
            console.log('Godot Engine успешно загружен!');
            
            // Передача данных в Godot после загрузки
            const userData = {
                id: tg.initDataUnsafe.user?.id,
                first_name: tg.initDataUnsafe.user?.first_name,
                username: tg.initDataUnsafe.user?.username
            };
            
            // Вариант 1: Через ccall (если настроено в Godot)
            if (window.Module) {
                window.Module.ccall('receive_telegram_data', 
                                 'void', 
                                 ['string'], 
                                 [JSON.stringify(userData)]);
            }
            
            // Вариант 2: Через глобальную переменную
            window.TelegramUserData = userData;
        }).catch((err) => {
            console.error('Ошибка загрузки Godot:', err);
            tg.showAlert('Произошла ошибка при загрузке игры');
        });
    </script>
</body>
</html>
