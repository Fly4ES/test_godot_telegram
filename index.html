<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="testTelegramExport.js.js"></script>
    <style>body { margin: 0; padding: 0; }</style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть приложение на весь экран
        tg.enableClosingConfirmation(); // Подтверждение выхода

        // Передача данных в Godot
        function sendUserData() {
            const user = {
                id: tg.initDataUnsafe.user?.id,
                first_name: tg.initDataUnsafe.user?.first_name,
                username: tg.initDataUnsafe.user?.username
            };
            // Отправляем в Godot через JavaScript-интерфейс
            if (window.Module) {
                window.Module.ccall('receive_telegram_data', 'void', ['string'], [JSON.stringify(user)]);
            }
        }

        // Инициализация Godot
        const engine = new Engine();
        engine.startGame({
            "canvas": document.getElementById("canvas"),
            "onExecute": sendUserData
        });
    </script>
</body>
</html>
