<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="testTelegramExport.js"></script>
    <style>body { margin: 0; padding: 0; overflow: hidden; }</style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Создаем глобальный объект для моста
        window.GodotBridge = {
            platform: {
                id: "telegram",
                user: {
                    id: tg.initDataUnsafe.user?.id,
                    first_name: tg.initDataUnsafe.user?.first_name,
                    username: tg.initDataUnsafe.user?.username
                },
                init_data_raw: tg.initData
            }
        };
    
        const engine = new Engine();
        engine.startGame({
            canvas: document.getElementById('canvas'),
            executable: 'testTelegramExport',
            mainPack: 'testTelegramExport.pck',
            locateFile: (path) => path
        }).then(() => {
            console.log("Godot загружен!");
            // Передаем данные в Godot через глобальную переменную
            if (window.Module) {
                Module.ccall('init_telegram_data', 'void', [], []);
            }
        });
    </script>
</body>
</html>
